[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wiki-mcp"
version = "0.1.0"
description = "Automated, schema-validated editing of MediaWiki-based wikis (wiki.gg, Fandom, self-hosted, ...), with an MCP server for agent-driven edits."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "cogitofallacy" }]
dependencies = [
    "requests>=2.31",
    "mwparserfromhell>=0.6.6",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
mcp = ["mcp>=2.0"]
dev = ["pytest>=8.0", "responses>=0.25"]

[project.scripts]
wiki-mcp = "wiki_mcp_cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wikibot", "src/wiki_mcp", "src/wiki_mcp_cli"]
